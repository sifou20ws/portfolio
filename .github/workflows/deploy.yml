name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The site lives at /portfolio/, so the base href must match the repo name.
      # No service worker: visitors always get the latest deploy.
      - run: flutter build web --release --base-href "/portfolio/" --pwa-strategy=none
      # Retire the caching service worker older versions installed for returning
      # visitors (see the file for details).
      - run: cp tool/kill_switch_service_worker.js build/web/flutter_service_worker.js
      # Clean URLs on a static host: a real page per project (with its own
      # link preview) and a 404.html fallback. See the script for details.
      - run: python3 tool/generate_route_pages.py build/web https://sifou20ws.github.io/portfolio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
